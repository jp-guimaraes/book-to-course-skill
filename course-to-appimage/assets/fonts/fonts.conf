<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used by the course AppImage (AppRun sets FONTCONFIG_FILE): the system's own font setup, plus the bundled
     colour emoji font as a fallback, so emoji show even on systems that have none installed. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
